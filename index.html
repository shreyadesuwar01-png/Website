<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zesty Vibe</title>
<style>
:root{--bg:#f6f6f4;--card:#ffffff;--text:#1c1c1c;--muted:#6b6b6b;--accent:#ff6a00;--border:#e6e6e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1c;--text:#f2f2f2;--muted:#a0a0a0;--accent:#ff8a33;--border:#2c2c2c}}
:root[data-theme="dark"]{--bg:#121212;--card:#1c1c1c;--text:#f2f2f2;--muted:#a0a0a0;--accent:#ff8a33;--border:#2c2c2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:48px 16px 40px}
.wrap{max-width:420px;margin:0 auto}
.head{text-align:center;margin-bottom:28px}
.logo{display:block;margin:0 auto;height:130px;width:auto;max-width:100%;background:#fff;border-radius:16px;padding:10px}
.bar{width:36px;height:3px;background:var(--accent);margin:12px auto 10px;border-radius:2px}
.head p{margin:0;color:var(--muted);font-size:.95rem}
.list{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.list a{display:flex;align-items:center;gap:14px;padding:16px 18px;color:var(--text);text-decoration:none;border-top:1px solid var(--border)}
.list a:first-child{border-top:0}
.list a:active{background:var(--bg)}
.ic{flex:none;width:22px;height:22px;color:var(--accent)}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:600;font-size:1rem}
.t span{font-size:.85rem;color:var(--muted)}
.ch{color:var(--muted);font-size:1.2rem}
.foot{text-align:center;margin-top:24px;font-size:.78rem;color:var(--muted)}
</style>
</head>
